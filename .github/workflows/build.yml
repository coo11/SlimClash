name: build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * fri"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        run: |
          # Convert UTF-8 scripts to GBK and use Windows line endings.
          for file in scripts/*.bat; do
            iconv -f UTF-8 -t GBK -c "$file" > tmp
            tr -d '\r' < tmp | sed 's/$/\r/' > "$file"
            rm tmp
          done
      - name: Download and Uncompress
        run: |
          clash=$(
            curl -fsSL 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' |
            python -c "import sys, json; src=json.load(sys.stdin); urls=[i['browser_download_url'] for i in src['assets'] if 'windows-amd64-v3' in i['name']]; print(src['tag_name'] + ';' + urls[0])"
          )
          release_mark=$(echo "$clash" | cut -d ";" -f 1)
          echo "RELEASE_TITLE=SlimClash ${release_mark}.zip" >> "$GITHUB_ENV"
          {
            echo 'RELEASE_DESC<<EOF'
            echo "> Based on Clash.Meta ${release_mark}, packaged for Windows amd64."
            echo "## Related Links"
            echo "- [Original Release](https://github.com/MetaCubeX/mihomo/releases/latest)"
            echo "- Dashboard - [Zashboard](https://github.com/Zephyruso/zashboard)"
            echo "- Dashboard - [Official](https://github.com/MetaCubeX/metacubexd)"
            echo 'EOF'
          } >> "$GITHUB_ENV"

          curl -fsSLo clash.zip "$(echo "$clash" | cut -d ";" -f 2)"
          7z x clash.zip
          pip install pyyaml
          dashboard_url=$(python -c "import yaml; print(yaml.safe_load(open('config/basic.yaml'))['external-ui-url'])")
          curl -fsSLO https://github.com/coo11/SlimClash/releases/download/wintools/EnableLoopback.exe
          curl -fsSL -o dashboard.zip "$dashboard_url"
          7z x dashboard.zip -odashboard_archive
      - name: Pack related files
        run: |
          mkdir -p SlimClash/.clash/dashboard SlimClash/.clash/ruleset
          mv "$(ls -t mihomo-windows-amd64*.exe | head -n1)" SlimClash/clash.exe
          mv EnableLoopback.exe SlimClash/EnableLoopback.exe
          dashboard_dir=$(find dashboard_archive -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$dashboard_dir"
          cp -R "$dashboard_dir"/. SlimClash/.clash/dashboard/

          mkdir -p geo_download
          mkdir -p ruleset_download
          python _parser.py
          mv geo_download/* SlimClash/.clash/
          mv ruleset_download/* SlimClash/.clash/
          mv output.yaml SlimClash/.clash/config.yaml
          cp src/icon.ico SlimClash/icon.ico
          cp scripts/*.bat scripts/*.vbs -t SlimClash/

          7z a -mm=Deflate -mfb=258 -mpass=15 -r SlimClash.zip SlimClash/
      - name: Update Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: weeklybuild
          prerelease: false
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ env.RELEASE_DESC }}
          files: |
            SlimClash.zip
            ./SlimClash/.clash/config.yaml
