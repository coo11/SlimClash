<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title description">
  <title id="title">SlimClash Startup Flow</title>
  <desc id="description">Startup, runtime, failure handling, and cleanup flow for the SlimClash launcher.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"></path>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .setup { fill: #eff6ff; stroke: #3b82f6; }
      .proxy { fill: #ecfdf5; stroke: #10b981; }
      .run { fill: #f5f3ff; stroke: #8b5cf6; }
      .cleanup { fill: #fff7ed; stroke: #f97316; }
      .error { fill: #fef2f2; stroke: #ef4444; }
      .terminal { fill: #172033; stroke: #172033; }
      .terminal-text { fill: #fff; font-size: 15px; font-weight: 700; }
      .heading { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #526179; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .error-arrow { fill: none; stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .error-text { font-size: 12px; fill: #b91c1c; font-weight: 600; }
    </style>
  </defs>
  <rect width="800" height="1000" fill="#fff"></rect>
  <rect x="275" y="40" width="250" height="48" rx="24" class="terminal"></rect>
  <text x="400" y="70" text-anchor="middle" class="terminal-text" style="white-space: pre; font-size: 15px;">Launch SlimClash</text>
  <rect x="200" y="112" width="400" height="78" rx="10" class="node setup"></rect>
  <text x="400" y="140" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">1. Prepare paths and preferences</text>
  <text x="400" y="164" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Resolve clash.exe, config.yaml, and tray visibility marker</text>
  <rect x="200" y="214" width="400" height="94" rx="10" class="node setup"></rect>
  <text x="400" y="242" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">2. Ensure a single instance</text>
  <text x="400" y="266" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Acquire a path-specific mutex; restore a hidden instance</text>
  <text x="400" y="288" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">or replace matching launcher and proxy processes</text>
  <rect x="200" y="332" width="400" height="86" rx="10" class="node setup"></rect>
  <text x="400" y="360" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">3. Read proxy configuration</text>
  <text x="400" y="384" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Load ports, controller address, and API secret</text>
  <text x="400" y="406" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">Build the Dashboard URL; prefer mixed-port for system proxy</text>
  <rect x="200" y="442" width="400" height="88" rx="10" class="node proxy"></rect>
  <text x="400" y="470" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">4. Configure Windows proxy</text>
  <text x="400" y="494" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Set user proxy and http_proxy / https_proxy environment variables</text>
  <text x="400" y="516" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">Broadcast settings changes</text>
  <rect x="200" y="554" width="400" height="88" rx="10" class="node run"></rect>
  <text x="400" y="582" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">5. Start tray window and Mihomo</text>
  <text x="400" y="606" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Launch clash.exe -d ".clash" and add the tray icon</text>
  <text x="400" y="628" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">Show startup notification with configured ports</text>
  <rect x="200" y="666" width="400" height="112" rx="10" class="node run"></rect>
  <text x="400" y="694" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">6. Run message and process loop</text>
  <text x="400" y="718" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Handle tray actions and wait for Mihomo to exit</text>
  <text x="400" y="740" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Switch mode, reload config, open Dashboard or config folder</text>
  <text x="400" y="762" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">User exit or proxy exit leads to cleanup</text>
  <rect x="200" y="802" width="400" height="86" rx="10" class="node cleanup"></rect>
  <text x="400" y="830" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">7. Clean up</text>
  <text x="400" y="854" text-anchor="middle" class="body" style="white-space: pre; font-size: 13px;">Remove tray icon, stop Mihomo, restore proxy settings</text>
  <text x="400" y="876" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">Release mutex and exit</text>
  <rect x="275" y="912" width="250" height="48" rx="24" class="terminal"></rect>
  <text x="400" y="942" text-anchor="middle" class="terminal-text" style="white-space: pre; font-size: 15px;">Exit</text>
  <rect x="15" y="347" width="155" height="74" rx="9" class="node error"></rect>
  <text x="92" y="372" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">Early failure</text>
  <text x="92" y="394" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">Show error; release</text>
  <text x="92" y="411" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">acquired mutex</text>
  <rect x="630" y="560" width="155" height="74" rx="9" class="node error"></rect>
  <text x="707" y="585" text-anchor="middle" class="heading" style="white-space: pre; font-size: 16px;">Launch failure</text>
  <text x="707" y="607" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">Show error and run</text>
  <text x="707" y="624" text-anchor="middle" class="small" style="white-space: pre; font-size: 12px;">cleanup</text>
  <path d="M 400 88 L 400 112 M 400 190 L 400 214 M 400 308 L 400 332 M 400 418 L 400 442 M 400 530 L 400 554 M 400 642 L 400 666 M 400 778 L 400 802 M 400 888 L 400 912" class="arrow"></path>
  <path d="M 200 374 L 170 374" class="error-arrow"></path>
  <path d="M 92 421 L 92 936 L 275 936" class="error-arrow"></path>
  <path d="M 600 598 L 630 598" class="error-arrow"></path>
  <path d="M 707 634 L 707 845 L 600 845" class="error-arrow"></path>
</svg>